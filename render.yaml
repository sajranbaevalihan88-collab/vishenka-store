databases:
  - name: vishenka-db
    plan: free
    databaseName: vishenka_db
    user: vishenka_db_user

services:
  - type: web
    name: vishenka-store
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/sajranbaevalihan88-collab/vishenka-store
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vishenka-db
          property: connectionString
      - key: PORT
        value: 8000
